name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew build

      - name: Start application
        run: java -jar ./build/libs/app-mbank.jar &

      - name: Wait for app to start
        run: sleep 15

      - name: Run tests
        run: ./gradlew test

      - name: Start MySQL (sql homework)
        run: docker compose up -d
        working-directory: sql

      - name: Wait for MySQL
        run: sleep 30

      - name: Run sql tests
        run: |
          chmod +x gradlew
          ./gradlew test
        working-directory: sql

      - name: Stop containers
        if: always()
        run: docker compose down -v
        working-directory: sql
